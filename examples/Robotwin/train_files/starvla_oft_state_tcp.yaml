# VLAct OFT: frozen VLM, trainable output projection/state/TCP encoders/head.
run_id: vlact_oft_state_tcp_wrap32
run_root_dir: /scratch/jliu3375/runs
seed: 42
is_debug: false
# Null uses the logged-in account's default workspace; WANDB_ENTITY overrides.
wandb_entity: null
wandb_project: VLAct_Robotwin_TCP

framework:
  name: QwenOFT
  qwenvl:
    base_vlm: StarVLA/Qwen3-VL-4B-Instruct-Action
    attn_implementation: sdpa
  action_model:
    action_model_type: MLP
    action_dim: 14
    action_hidden_dim: 2560
    action_horizon: 32
    future_action_window_size: 31
    past_action_window_size: 0
    use_time_budget: false
  conditioning:
    enabled: true
    freeze_vlm: true
    include_state: ${datasets.vla_data.include_state}
    include_tcp: ${datasets.vla_data.include_tcp}
    state_dim: 14
    tcp_dim: 14
    encoder_hidden_dim: 1024
    state_input_space: raw

datasets:
  vla_data:
    dataset_py: lerobot_datasets
    # This is the TCP-enriched dataset selected by the user, NOT the plain
    # Clean root or the RawLast variant. The mix name selects task/action schema.
    data_root_dir: /scratch/jliu3375/datasets/RoboTwin-Clean-TCP
    data_mix: robotwin_wrap_32
    expected_task_count: 50
    expected_episodes_per_task: 50
    include_state: true
    include_tcp: true
    tcp_target_schema_version: 2
    tcp_cache_size: 32
    include_target_pose: false
    include_time_budget: false
    train_start_frames: null
    drop_incomplete_action_chunks: false
    action_mode: abs
    action_type: abs_qpos
    pretrained_stats_path: /scratch/jliu3375/checkpoints/VLAct-OFT-Robotwin-Clean-wrap32/dataset_statistics.json
    balance_dataset_weights: true
    sequential_step_sampling: false
    per_device_batch_size: 16
    num_workers: 4
    pin_memory: true
    persistent_workers: false
    image_size: [224, 224]
    image_size_buckets: [[320, 180], [280, 210]]
    video_backend: pyav
    CoT_prompt: 'Robot: AgileX, Action: Absolute joint. FPS: 15. Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format.'

trainer:
  pretrained_checkpoint: /scratch/jliu3375/checkpoints/VLAct-OFT-Robotwin-Clean-wrap32/checkpoints/steps_50000_pytorch_model.pt
  # The official VLAct trainer supports both flags. Loading only the VLM
  # leaves all new modules, including the OFT head, freshly initialized.
  reload_modules: qwen_vl_interface
  random_init_action_model: true
  freeze_modules: qwen_vl_interface
  is_resume: false
  reset_steps: true
  enable_gradient_checkpointing: false
  max_train_steps: 50000
  num_warmup_steps: 5000
  save_interval: 10000
  # Wrapped OFT convergence is monitored with action_loss, not raw MSE/MAE.
  # Zero disables the extra training-loader diagnostic forward/batch.
  eval_interval: 0
  logging_frequency: 100
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  learning_rate:
    base: 1.0e-4
    action_model: 1.0e-4
    conditioning: 1.0e-4
  shortest_angular_joint_loss: true
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 5.0e-7
  optimizer:
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8
